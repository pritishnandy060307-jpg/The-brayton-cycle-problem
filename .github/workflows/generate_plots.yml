name: Generate Matplotlib plots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-plots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install numpy matplotlib

      - name: Generate plots with Matplotlib
        run: python Brayton_Cycle_3D_Parameter_Study.py

      - name: Commit generated Matplotlib PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plots/3D_parameter_study.png plots/10_point_first_law_comparison.png
          git diff --cached --quiet || git commit -m "Generate Matplotlib PNG plots"
          git push
